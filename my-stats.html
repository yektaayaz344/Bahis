<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İstatistiklerim | WC2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toastContainer"></div>

  <nav>
    <a class="nav-brand" href="index.html">WC2026 ⚽</a>
    <div class="nav-center" id="navCenter">
      <ul class="nav-links">
        <li><a href="matches.html">Maçlar</a></li>
        <li><a href="leaderboard.html">Sıralama</a></li>
        <li><a href="my-stats.html" class="active">İstatistiklerim</a></li>
        <li><a href="admin.html" id="adminLink" style="display:none">Admin</a></li>
      </ul>
    </div>
    <div class="nav-actions">
      <button id="logoutBtn" class="btn btn-ghost" style="padding:0.4rem 0.875rem;font-size:0.8rem">Çıkış</button>
      <button class="nav-hamburger" id="hamburger" aria-label="Menü">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="container animate-fade">
    <header style="margin-bottom:2rem">
      <p style="color:var(--text-muted);font-size:0.8rem;letter-spacing:0.06em;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;margin-bottom:0.25rem">Hoş geldin</p>
      <h1 style="font-size:2.25rem;margin-bottom:0.2rem" id="welcomeUser">—</h1>
      <p style="color:var(--text-muted);font-size:0.875rem">Performansını analiz et.</p>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Toplam Puan</div>
        <div class="stat-value" id="statTotalPoints">—</div>
        <div class="stat-sub">genel sıralamada</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Başarı Oranı</div>
        <div class="stat-value success-val" id="statSuccessRate">—</div>
        <div class="stat-sub" id="statCorrect" style="color:var(--text-muted)">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Sıralama</div>
        <div class="stat-value accent-val" id="statRank">—</div>
        <div class="stat-sub">genel sıralamada</div>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:0.75rem">
      <h2 style="font-size:1.5rem">Tahmin Geçmişi</h2>
    </div>

    <div id="historyList" style="display:flex;flex-direction:column;gap:0.75rem">
      <div class="skeleton" style="height:72px;border-radius:var(--radius-lg)"></div>
      <div class="skeleton" style="height:72px;border-radius:var(--radius-lg)"></div>
      <div class="skeleton" style="height:72px;border-radius:var(--radius-lg)"></div>
    </div>

    <div style="margin-top:2.5rem">
      <h2 style="font-size:1.5rem;margin-bottom:0.25rem">Bot Karşılaştırması</h2>
      <p style="color:var(--text-muted);font-size:0.8rem;margin-bottom:1.25rem">3 farklı strateji uygulayan botların performansı.</p>
      <div id="botStatsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem">
        <div class="skeleton" style="height:110px;border-radius:var(--radius-lg)"></div>
        <div class="skeleton" style="height:110px;border-radius:var(--radius-lg)"></div>
        <div class="skeleton" style="height:110px;border-radius:var(--radius-lg)"></div>
      </div>
    </div>
  </div>

  <script>
    window.showToast = function(message, type) {
      type = type || 'info';
      var container = document.getElementById('toastContainer');
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      var icons = { success: '✓', error: '✗', info: 'i' };
      toast.innerHTML = '<span class="toast-icon">' + (icons[type]||'i') + '</span><span>' + message + '</span>';
      container.appendChild(toast);
      setTimeout(function() { toast.classList.add('show'); }, 10);
      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { toast.remove(); }, 300);
      }, 3500);
    };

    document.getElementById('hamburger').addEventListener('click', function() {
      document.getElementById('navCenter').classList.toggle('open');
    });
  </script>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { requireAuth, logout, isAdmin } from './js/auth.js';

    async function init() {
      const session = await requireAuth();
      if (!session) return;
      if (isAdmin(session)) document.getElementById('adminLink').style.display = 'block';
      const { data: userData } = await supabase.from('users').select('username').eq('id', session.user.id).single();
      if (userData?.username) document.getElementById('welcomeUser').textContent = userData.username;
      await loadStats(session.user.id);
      await loadHistory(session.user.id);
      await loadBotStats();
    }

    async function loadStats(userId) {
      const [statsRes, allRes] = await Promise.all([
        supabase.from('leaderboard_cache').select('*').eq('user_id', userId).maybeSingle(),
        supabase.from('leaderboard_cache').select('user_id, total_points').order('total_points', { ascending: false })
      ]);
      const stats = statsRes.data;
      const all   = allRes.data || [];
      const rank  = all.findIndex(r => r.user_id === userId) + 1;

      if (stats) {
        document.getElementById('statTotalPoints').textContent = stats.total_points;
        document.getElementById('statRank').textContent = rank > 0 ? '#' + rank : '—';
        const rate = stats.total_predictions > 0 ? Math.round(stats.correct_predictions / stats.total_predictions * 100) : 0;
        document.getElementById('statSuccessRate').textContent = '%' + rate;
        document.getElementById('statCorrect').textContent = stats.correct_predictions + '/' + stats.total_predictions + ' tahmin';
      } else {
        document.getElementById('statTotalPoints').textContent = '0';
        document.getElementById('statRank').textContent = '—';
        document.getElementById('statSuccessRate').textContent = '%0';
        document.getElementById('statCorrect').textContent = '0/0 tahmin';
      }
    }

    async function loadHistory(userId) {
      const list = document.getElementById('historyList');
      const { data: preds, error } = await supabase
        .from('predictions')
        .select('*, matches(home_team,away_team,home_flag,away_flag,home_score,away_score,status), bet_options(label,odds_value)')
        .eq('user_id', userId)
        .order('created_at', { ascending: false });

      if (error) { list.innerHTML = `<div class="card" style="color:var(--danger)">Hata: ${error.message}</div>`; return; }
      if (!preds?.length) { list.innerHTML = `<div class="card"><div class="empty-state">Henüz tahmin yapmamışsın.<br><a href="matches.html" style="color:var(--primary);text-decoration:none;font-weight:600">Maçlar sayfasına git →</a></div></div>`; return; }

      list.innerHTML = preds.map(p => {
        const isFinished = p.matches?.status === 'finished';
        const statusText = !isFinished ? 'Bekliyor' : (p.is_correct ? 'Kazandı' : 'Kaybetti');
        const statusClass = !isFinished ? 'pred-pending' : (p.is_correct ? 'pred-win' : 'pred-loss');
        return `<div class="pred-history-item ${statusClass}">
          <div>
            <div class="pred-match">${p.matches?.home_flag} ${p.matches?.home_team} vs ${p.matches?.away_team} ${p.matches?.away_flag}</div>
          </div>
          <div>
            <div class="pred-choice">Seçim: <strong>${p.bet_options?.label}</strong> @ ${Number(p.odds_at_prediction).toFixed(1)}</div>
          </div>
          <div class="pred-status-col">
            <span class="pred-status-badge ${statusClass}">${statusText}</span>
            ${isFinished ? `<span class="pred-score">${p.matches?.home_score} - ${p.matches?.away_score}</span>` : ''}
          </div>
          <div class="pred-points">
            ${p.is_correct ? `+${p.points_earned}` : (isFinished ? '0' : '—')}<span>puan</span>
          </div>
        </div>`;
      }).join('');
    }

    async function loadBotStats() {
      const grid = document.getElementById('botStatsGrid');
      const { data: bots } = await supabase
        .from('users')
        .select('id, username, leaderboard_cache(*)')
        .eq('is_bot', true);

      if (!bots?.length) {
        grid.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;grid-column:1/-1">Botlar henüz kurulmamış.</div>';
        return;
      }

      const icons = { Favorici: '🎯', Riskci: '🎲', Ortanci: '⚖️' };
      const descs = { Favorici: 'En favoriyi seçer', Riskci: 'En risklisini seçer', Ortanci: 'Ortanca seçer' };

      grid.innerHTML = bots.map(bot => {
        const lb   = bot.leaderboard_cache;
        const pts  = lb?.total_points ?? 0;
        const cor  = lb?.correct_predictions ?? 0;
        const tot  = lb?.total_predictions ?? 0;
        const rate = tot > 0 ? Math.round(cor / tot * 100) : 0;
        const icon = icons[bot.username] || '🤖';
        const desc = descs[bot.username] || '';
        return `<div class="stat-card" style="text-align:center">
          <div style="font-size:1.75rem;margin-bottom:0.25rem">${icon}</div>
          <div style="font-weight:700;font-size:0.9rem;margin-bottom:0.15rem">${bot.username}</div>
          <div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:0.75rem">${desc}</div>
          <div style="display:flex;justify-content:center;gap:1.25rem">
            <div>
              <div style="font-family:var(--font-display);font-size:1.3rem;font-weight:800;color:var(--primary)">${pts}</div>
              <div style="font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em">puan</div>
            </div>
            <div>
              <div style="font-family:var(--font-display);font-size:1.3rem;font-weight:800;color:var(--success)">${rate}%</div>
              <div style="font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em">${cor}/${tot}</div>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
    init();
  </script>
</body>
</html>
