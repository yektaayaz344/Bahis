<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İstatistiklerim | UCL & UEL Bahis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toastContainer"></div>

  <nav>
    <a class="nav-brand" href="index.html">
      🏆 UCL & UEL <span class="league-tag">FB • GS • BJK</span>
    </a>
    <div class="nav-center" id="navCenter">
      <ul class="nav-links">
        <li><a href="matches.html">Maçlar</a></li>
        <li><a href="leaderboard.html">Sıralama</a></li>
        <li><a href="my-stats.html" class="active">İstatistiklerim</a></li>
        <li><a href="admin.html" id="adminLink" style="display:none">Admin</a></li>
      </ul>
    </div>
    <div class="nav-actions">
      <button id="logoutBtn" class="btn btn-ghost" style="padding:0.4rem 0.875rem;font-size:0.8rem">Çıkış</button>
      <button class="nav-hamburger" id="hamburger" aria-label="Menü">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="container animate-fade">
    <header style="margin-bottom:2rem;">
      <h1 class="gradient-text" style="font-size:2.25rem;margin-bottom:0.2rem">Tahmin İstatistiklerim</h1>
      <p style="color:var(--text-muted);font-size:0.9rem;font-weight:600;">
        FB, GS ve BJK Avrupa maçlarındaki tahmin başarım ve geçmişiniz.
      </p>
    </header>

    <!-- Stats Cards Grid -->
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:1.25rem; margin-bottom:2rem;">
      <div class="card" style="text-align:center;">
        <div style="font-size:0.75rem; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.4rem;">TOPLAM TAHMİN</div>
        <div id="statTotal" style="font-family:var(--font-display); font-size:2.5rem; font-weight:800; color:#fff;">0</div>
      </div>
      <div class="card" style="text-align:center;">
        <div style="font-size:0.75rem; color:var(--success); font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.4rem;">DOĞRU TAHMİN</div>
        <div id="statCorrect" style="font-family:var(--font-display); font-size:2.5rem; font-weight:800; color:var(--success);">0</div>
      </div>
      <div class="card" style="text-align:center;">
        <div style="font-size:0.75rem; color:var(--danger); font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.4rem;">YANLIŞ TAHMİN</div>
        <div id="statWrong" style="font-family:var(--font-display); font-size:2.5rem; font-weight:800; color:var(--danger);">0</div>
      </div>
      <div class="card" style="text-align:center;">
        <div style="font-size:0.75rem; color:var(--ucl-cyan); font-weight:700; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.4rem;">BAŞARI ORANI</div>
        <div id="statAccuracy" style="font-family:var(--font-display); font-size:2.5rem; font-weight:800; color:var(--ucl-cyan);">%0</div>
      </div>
    </div>

    <!-- Prediction History Card -->
    <div class="card">
      <h3 style="margin-bottom:1rem; font-size:1.2rem;">Tahmin Geçmişim</h3>
      <div id="historyContainer">
        <div style="text-align:center; padding:2rem; color:var(--text-muted);">Tahminler yükleniyor...</div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('hamburger').addEventListener('click', function() {
      document.getElementById('navCenter').classList.toggle('open');
    });
  </script>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { requireAuth, logout, isAdmin } from './js/auth.js';

    async function init() {
      const session = await requireAuth();
      if (!session) return;
      if (isAdmin(session)) document.getElementById('adminLink').style.display = 'block';
      document.getElementById('logoutBtn').addEventListener('click', logout);

      await loadStats(session.user.id);
    }

    async function loadStats(userId) {
      const { data: predictions, error } = await supabase
        .from('predictions')
        .select('*, matches(*), bet_options(*)')
        .eq('user_id', userId)
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('historyContainer').innerHTML = `<div style="color:var(--danger);">Hata: ${error.message}</div>`;
        return;
      }

      let total = predictions ? predictions.length : 0;
      let correct = 0;
      let wrong = 0;
      let pending = 0;

      (predictions || []).forEach(p => {
        if (p.matches?.status === 'finished') {
          if (p.is_correct === true) correct++;
          else wrong++;
        } else {
          pending++;
        }
      });

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statCorrect').textContent = correct;
      document.getElementById('statWrong').textContent = wrong;
      const accuracyPct = (correct + wrong) > 0 ? ((correct / (correct + wrong)) * 100).toFixed(1) : '0';
      document.getElementById('statAccuracy').textContent = `%${accuracyPct}`;

      const historyDiv = document.getElementById('historyContainer');
      if (!predictions || predictions.length === 0) {
        historyDiv.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-muted);">Henüz hiç tahmin yapmadınız.</div>`;
        return;
      }

      historyDiv.innerHTML = `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>MAÇ</th>
              <th>ORGANİZASYON</th>
              <th style="text-align:center;">TAHMİNİNİZ</th>
              <th style="text-align:center;">SKOR</th>
              <th style="text-align:right;">DURUM</th>
            </tr>
          </thead>
          <tbody>
            ${predictions.map(p => {
              const match = p.matches;
              const opt = p.bet_options;
              const isFinished = match?.status === 'finished';

              let statusBadge = '<span class="status-badge badge-open">BEKLİYOR</span>';
              if (isFinished) {
                statusBadge = p.is_correct
                  ? '<span class="status-badge badge-open" style="background:rgba(0,230,118,0.2); color:var(--success);">DOĞRU (+1 Puan)</span>'
                  : '<span class="status-badge badge-finished" style="background:rgba(255,51,102,0.2); color:var(--danger);">YANLIŞ</span>';
              }

              const pickCode = opt?.outcome_key === 'home_win' ? '1 (Ev Sahibi)' : (opt?.outcome_key === 'draw' ? 'X (Beraberlik)' : '2 (Deplasman)');

              return `
                <tr>
                  <td>
                    <span style="font-weight:700; color:#fff;">${match ? match.home_team : '-'} vs ${match ? match.away_team : '-'}</span>
                  </td>
                  <td>
                    <span style="font-size:0.8rem; color:var(--ucl-cyan);">${match ? match.group_name : '-'}</span>
                  </td>
                  <td style="text-align:center; font-weight:700; color:var(--ucl-gold);">
                    ${pickCode}
                  </td>
                  <td style="text-align:center; font-weight:700;">
                    ${isFinished ? `${match.home_score} - ${match.away_score}` : 'VS'}
                  </td>
                  <td style="text-align:right;">
                    ${statusBadge}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    init();
  </script>
</body>
</html>
