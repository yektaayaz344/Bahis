<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sıralama | UCL & UEL Bahis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toastContainer"></div>

  <nav>
    <a class="nav-brand" href="index.html">
      🏆 UCL & UEL <span class="league-tag">FB • GS • BJK</span>
    </a>
    <div class="nav-center" id="navCenter">
      <ul class="nav-links">
        <li><a href="matches.html">Maçlar</a></li>
        <li><a href="leaderboard.html" class="active">Sıralama</a></li>
        <li><a href="my-stats.html">İstatistiklerim</a></li>
        <li><a href="admin.html" id="adminLink" style="display:none">Admin</a></li>
      </ul>
    </div>
    <div class="nav-actions">
      <button id="logoutBtn" class="btn btn-ghost" style="padding:0.4rem 0.875rem;font-size:0.8rem">Çıkış</button>
      <button class="nav-hamburger" id="hamburger" aria-label="Menü">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="container animate-fade">
    <header style="margin-bottom:2rem;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem">
      <div>
        <h1 class="gradient-text" style="font-size:2.25rem;margin-bottom:0.2rem">Liderlik Tablosu</h1>
        <p style="color:var(--text-muted);font-size:0.9rem;font-weight:600;">
          En çok doğru tahmin yapan yarışmacılar (1 - X - 2 Doğru Tahmin Sayısı)
        </p>
      </div>
    </header>

    <div class="card">
      <div id="leaderboardContent">
        <div style="text-align:center; padding:2.5rem; color:var(--ucl-cyan); font-family:var(--font-display); font-size:1.4rem;">
          Liderlik Tablosu Yükleniyor...
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('hamburger').addEventListener('click', function() {
      document.getElementById('navCenter').classList.toggle('open');
    });
  </script>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { requireAuth, logout, isAdmin } from './js/auth.js';

    async function init() {
      const session = await requireAuth();
      if (!session) return;
      if (isAdmin(session)) document.getElementById('adminLink').style.display = 'block';
      document.getElementById('logoutBtn').addEventListener('click', logout);

      await loadLeaderboard();
    }

    async function loadLeaderboard() {
      const container = document.getElementById('leaderboardContent');

      // Fetch users and their correct predictions tally
      const { data: users, error: userError } = await supabase.from('users').select('id, username');
      if (userError) {
        container.innerHTML = `<div style="color:var(--danger); padding:1rem;">Hata: ${userError.message}</div>`;
        return;
      }

      const { data: predictions, error: predError } = await supabase
        .from('predictions')
        .select('user_id, is_correct');

      if (predError) {
        container.innerHTML = `<div style="color:var(--danger); padding:1rem;">Hata: ${predError.message}</div>`;
        return;
      }

      // Aggregate user stats
      const userStatsMap = new Map();
      users.forEach(u => {
        userStatsMap.set(u.id, { username: u.username, total: 0, correct: 0 });
      });

      (predictions || []).forEach(p => {
        const stats = userStatsMap.get(p.user_id);
        if (stats) {
          stats.total += 1;
          if (p.is_correct === true) stats.correct += 1;
        }
      });

      const leaderList = Array.from(userStatsMap.values()).sort((a, b) => {
        if (b.correct !== a.correct) return b.correct - a.correct;
        return a.total - b.total; // Tie-breaker: fewer total picks for same correct count
      });

      if (leaderList.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-muted);">Henüz sıralama verisi bulunmuyor.</div>`;
        return;
      }

      container.innerHTML = `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th style="width:70px; text-align:center;">SIRA</th>
              <th>YARIŞMACI</th>
              <th style="text-align:center;">TOPLAM TAHMİN</th>
              <th style="text-align:center;">DOĞRU TAHMİN</th>
              <th style="text-align:right;">BAŞARI YÜZDESİ</th>
            </tr>
          </thead>
          <tbody>
            ${leaderList.map((row, index) => {
              const rank = index + 1;
              const rankClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));
              const pct = row.total > 0 ? ((row.correct / row.total) * 100).toFixed(1) : '0.0';

              return `
                <tr>
                  <td style="text-align:center;">
                    <span class="rank-badge ${rankClass}">${rank}</span>
                  </td>
                  <td>
                    <span style="font-weight:700; font-size:1.05rem; color:#fff;">${row.username}</span>
                  </td>
                  <td style="text-align:center; font-weight:600; color:var(--text-muted);">
                    ${row.total}
                  </td>
                  <td style="text-align:center;">
                    <span class="status-badge badge-open" style="font-size:0.95rem; font-family:var(--font-display); font-weight:800; padding:4px 12px;">
                      ${row.correct} Doğru
                    </span>
                  </td>
                  <td style="text-align:right; font-family:var(--font-display); font-size:1.1rem; font-weight:800; color:var(--ucl-cyan);">
                    %${pct}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    init();
  </script>
</body>
</html>
