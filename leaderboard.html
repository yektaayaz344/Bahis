<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sıralama | UCL & UEL Bahis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toastContainer"></div>

  <nav>
    <a class="nav-brand" href="index.html">
      🏆 UCL & UEL <span class="league-tag">FB • GS • BJK</span>
    </a>
    <div class="nav-center" id="navCenter">
      <ul class="nav-links">
        <li><a href="matches.html">Maçlar</a></li>
        <li><a href="leaderboard.html" class="active">Sıralama</a></li>
        <li><a href="my-stats.html">İstatistiklerim</a></li>
        <li><a href="admin.html" id="adminLink" style="display:none">Admin</a></li>
      </ul>
    </div>
    <div class="nav-actions">
      <button id="logoutBtn" class="btn btn-ghost" style="padding:0.4rem 0.875rem;font-size:0.8rem">Çıkış</button>
      <button class="nav-hamburger" id="hamburger" aria-label="Menü">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="container animate-fade">
    <header style="margin-bottom:2rem;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem">
      <div>
        <h1 class="gradient-text" style="font-size:2.25rem;margin-bottom:0.2rem">Liderlik Tablosu</h1>
        <p style="color:var(--text-muted);font-size:0.9rem;font-weight:600;">
          Maç Sonucu: <strong>1 Puan</strong> | Golcü Tahmini: <strong>2 Puan</strong> | Tam Skor: <strong>5 Puan</strong>
        </p>
      </div>
    </header>

    <div class="card">
      <div id="leaderboardContent">
        <div style="text-align:center; padding:2.5rem; color:var(--ucl-cyan); font-family:var(--font-display); font-size:1.4rem;">
          Liderlik Tablosu Yükleniyor...
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('hamburger').addEventListener('click', function() {
      document.getElementById('navCenter').classList.toggle('open');
    });
  </script>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { requireAuth, logout, isAdmin } from './js/auth.js';

    async function init() {
      const session = await requireAuth();
      if (!session) return;
      if (isAdmin(session)) document.getElementById('adminLink').style.display = 'block';
      document.getElementById('logoutBtn').addEventListener('click', logout);

      await loadLeaderboard();
    }

    async function loadLeaderboard() {
      const container = document.getElementById('leaderboardContent');

      const { data: users, error: userError } = await supabase.from('users').select('id, username');
      if (userError) {
        container.innerHTML = `<div style="color:var(--danger); padding:1rem;">Hata: ${userError.message}</div>`;
        return;
      }

      const { data: cache } = await supabase.from('leaderboard_cache').select('*');
      const cacheMap = new Map(cache?.map(c => [c.user_id, c]));

      const { data: predictions } = await supabase.from('predictions').select('user_id, points_earned, is_correct, predicted_home_score, predicted_scorer');

      const userStatsMap = new Map();
      users.forEach(u => {
        const c = cacheMap.get(u.id);
        userStatsMap.set(u.id, {
          username: u.username,
          points: c?.total_points ?? 0,
          correct1x2: 0,
          scorers: 0,
          exactScores: 0
        });
      });

      (predictions || []).forEach(p => {
        const stats = userStatsMap.get(p.user_id);
        if (stats && p.is_correct) {
          if (p.predicted_home_score !== null) stats.exactScores += 1;
          else if (p.predicted_scorer) stats.scorers += 1;
          else stats.correct1x2 += 1;
        }
      });

      const leaderList = Array.from(userStatsMap.values()).sort((a, b) => b.points - a.points);

      if (leaderList.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-muted);">Henüz sıralama verisi bulunmuyor.</div>`;
        return;
      }

      container.innerHTML = `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th style="width:70px; text-align:center;">SIRA</th>
              <th>YARIŞMACI</th>
              <th style="text-align:center;">1X2 BİLME (1P)</th>
              <th style="text-align:center;">GOLCÜ BİLME (2P)</th>
              <th style="text-align:center;">TAM SKOR BİLME (5P)</th>
              <th style="text-align:right;">TOPLAM PUAN</th>
            </tr>
          </thead>
          <tbody>
            ${leaderList.map((row, index) => {
              const rank = index + 1;
              const rankClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));

              return `
                <tr>
                  <td style="text-align:center;">
                    <span class="rank-badge ${rankClass}">${rank}</span>
                  </td>
                  <td>
                    <span style="font-weight:700; font-size:1.05rem; color:#fff;">${row.username}</span>
                  </td>
                  <td style="text-align:center; font-weight:600; color:var(--ucl-cyan);">
                    ${row.correct1x2} Maç
                  </td>
                  <td style="text-align:center; font-weight:600; color:var(--success);">
                    ${row.scorers} Golcü
                  </td>
                  <td style="text-align:center;">
                    <span class="status-badge badge-open" style="font-size:0.9rem; font-family:var(--font-display); font-weight:800; padding:4px 10px; background:rgba(255,215,0,0.15); color:var(--ucl-gold); border-color:rgba(255,215,0,0.3);">
                      🎯 ${row.exactScores} Skor
                    </span>
                  </td>
                  <td style="text-align:right; font-family:var(--font-display); font-size:1.4rem; font-weight:800; color:var(--ucl-gold);">
                    ${row.points} PUAN
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    init();
  </script>
</body>
</html>
