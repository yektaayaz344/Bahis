<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCL & UEL Bahis | FB, GS, BJK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
    </style>
</head>
<body>
    <div class="card" style="max-width: 400px; padding: 2.5rem; border-color: rgba(0, 217, 255, 0.4);">
        <div style="font-size: 3rem; margin-bottom: 0.5rem;">🏆</div>
        <h1 class="gradient-text" style="font-size: 2.2rem; margin-bottom: 0.5rem;">UCL & UEL BAHİS</h1>
        <p style="color: var(--text-muted); font-weight: 600; font-size: 0.9rem; margin-bottom: 1.5rem;">Fenerbahçe • Galatasaray • Beşiktaş</p>
        <div class="status-badge badge-open" style="display: inline-block; padding: 6px 16px;">Sistem Yükleniyor...</div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js';

        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = './matches.html';
            } else {
                window.location.href = './auth.html';
            }
        }

        checkSession();
    </script>
</body>
</html>
