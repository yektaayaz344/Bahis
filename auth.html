<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap | UCL & UEL Bahis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .auth-wrap {
      width: 100%;
      max-width: 420px;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-emoji {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 0.5rem;
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50%       { transform: translateY(-8px) rotate(5deg); }
    }

    .auth-logo h1 {
      font-family: var(--font-display);
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1;
      background: var(--gradient-ucl);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-logo p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 0.4rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid rgba(0, 102, 255, 0.2);
      border-radius: var(--radius-lg);
      padding: 2rem;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--gradient-ucl);
    }

    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1.75rem;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.04);
      padding: 4px;
    }

    .auth-tab {
      flex: 1;
      padding: 0.6rem;
      background: none;
      border: none;
      border-radius: calc(var(--radius-sm) - 2px);
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-tab.active {
      background: var(--gradient-ucl);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 102, 255, 0.4);
    }

    .auth-panel { display: none; }
    .auth-panel.active { display: block; }

    .btn-auth {
      width: 100%;
      padding: 0.8rem;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      margin-top: 0.5rem;
      font-weight: 700;
    }

    .auth-message {
      display: none;
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      font-size: 0.82rem;
      margin-top: 1rem;
      line-height: 1.5;
    }

    .auth-message.error {
      background: rgba(255,51,102,0.1);
      border: 1px solid rgba(255,51,102,0.3);
      color: var(--danger);
    }

    .auth-message.success {
      background: rgba(0,230,118,0.1);
      border: 1px solid rgba(0,230,118,0.3);
      color: var(--success);
    }
  </style>
</head>
<body>
  <div id="toastContainer"></div>

  <div class="auth-wrap">
    <div class="auth-logo">
      <span class="logo-emoji">🏆</span>
      <h1>UCL & UEL BAHİS</h1>
      <p>FB • GS • BJK Avrupa Tahminleri</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Giriş Yap</button>
        <button class="auth-tab" id="tabSignup" onclick="switchTab('signup')">Kayıt Ol</button>
      </div>

      <!-- GİRİŞ -->
      <div class="auth-panel active" id="panelLogin">
        <form id="loginForm">
          <div class="form-group">
            <label for="email">E-Posta</label>
            <input type="email" id="email" class="form-input" placeholder="ornek@mail.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Şifre</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-auth">Giriş Yap</button>
          <div id="loginError" class="auth-message error"></div>
        </form>
      </div>

      <!-- KAYIT -->
      <div class="auth-panel" id="panelSignup">
        <form id="signupForm">
          <div class="form-group">
            <label for="signupUsername">Kullanıcı Adı</label>
            <input type="text" id="signupUsername" class="form-input" placeholder="örn: fenerbahce1907" required minlength="3" maxlength="20" autocomplete="username">
          </div>
          <div class="form-group">
            <label for="signupEmail">E-Posta</label>
            <input type="email" id="signupEmail" class="form-input" placeholder="ornek@mail.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="signupPassword">Şifre</label>
            <input type="password" id="signupPassword" class="form-input" placeholder="En az 6 karakter" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-auth">Hesap Oluştur</button>
          <div id="signupError" class="auth-message error"></div>
          <div id="signupSuccess" class="auth-message success"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
      if (tab === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('panelLogin').classList.add('active');
      } else {
        document.getElementById('tabSignup').classList.add('active');
        document.getElementById('panelSignup').classList.add('active');
      }
    }
  </script>

  <script type="module">
    import { supabase } from './js/supabase.js';

    // Oturum kontrolü
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      window.location.href = './matches.html';
    }

    // Login Form Submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      errorDiv.style.display = 'none';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        errorDiv.textContent = error.message === 'Invalid login credentials' ? 'E-posta veya şifre hatalı.' : error.message;
        errorDiv.style.display = 'block';
      } else {
        window.location.href = './matches.html';
      }
    });

    // Signup Form Submit
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('signupUsername').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const errorDiv = document.getElementById('signupError');
      const successDiv = document.getElementById('signupSuccess');

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });

      if (error) {
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
      } else {
        successDiv.textContent = 'Kayıt başarılı! Yönlendiriliyorsunuz...';
        successDiv.style.display = 'block';
        setTimeout(() => { window.location.href = './matches.html'; }, 1200);
      }
    });
  </script>
</body>
</html>
