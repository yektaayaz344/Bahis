<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap | WC2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      background-image:
        radial-gradient(ellipse 90% 60% at 15% 15%, rgba(0,242,254,0.09) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 85%, rgba(79,172,254,0.09) 0%, transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: auto, auto, 44px 44px;
    }

    .auth-wrap {
      width: 100%;
      max-width: 400px;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-emoji {
      font-size: 3.25rem;
      display: block;
      margin-bottom: 0.5rem;
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50%       { transform: translateY(-9px) rotate(5deg); }
    }

    .auth-logo h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 3.25rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      line-height: 1;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 60%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-logo p {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin-top: 0.375rem;
      letter-spacing: 0.05em;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, #00f2fe, #4facfe 50%, #f093fb);
    }

    .auth-card::after {
      content: '';
      position: absolute;
      bottom: -40px; right: -40px;
      width: 140px; height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,242,254,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    #loginForm { position: relative; z-index: 1; }

    .btn-login {
      width: 100%;
      padding: 0.8rem;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      margin-top: 0.25rem;
      font-weight: 700;
    }

    #errorMessage {
      display: none;
      background: rgba(255,71,87,0.09);
      border: 1px solid rgba(255,71,87,0.25);
      border-radius: var(--radius-sm);
      padding: 0.7rem 0.875rem;
      color: var(--danger);
      font-size: 0.82rem;
      margin-top: 0.875rem;
      line-height: 1.5;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      margin: 1.5rem 0;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }

    .auth-divider span {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .invite-note {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.7;
    }

    .invite-note strong { color: var(--text-main); font-weight: 600; }
  </style>
</head>
<body class="animate-fade">
  <div id="toastContainer"></div>

  <div class="auth-wrap">
    <div class="auth-logo">
      <span class="logo-emoji">⚽</span>
      <h1>WC2026</h1>
      <p>Arkadaş Bahis Platformu</p>
    </div>

    <div class="auth-card">
      <form id="loginForm">
        <div class="input-group">
          <label for="email">E-Posta</label>
          <input type="email" id="email" placeholder="ornek@mail.com" required autocomplete="email">
        </div>
        <div class="input-group" style="margin-bottom:0.75rem">
          <label for="password">Şifre</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-login">Giriş Yap</button>
        <div id="errorMessage"></div>
      </form>

      <div class="auth-divider"><span>bilgi</span></div>

      <p class="invite-note">
        Hesabın yok mu? <strong>Grup adminine</strong> ulaşıp<br>
        davet isteğinde bulun. Kayıt sistemi<br>yalnızca davetle açık.
      </p>
    </div>
  </div>

  <script>
    window.showToast = function(message, type) {
      type = type || 'info';
      var container = document.getElementById('toastContainer');
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      var icons = { success: '✓', error: '✗', info: 'i' };
      toast.innerHTML = '<span class="toast-icon">' + (icons[type]||'i') + '</span><span>' + message + '</span>';
      container.appendChild(toast);
      setTimeout(function() { toast.classList.add('show'); }, 10);
      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { toast.remove(); }, 300);
      }, 3500);
    };
  </script>

  <script type="module">
    import { login } from './js/auth.js';
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = loginForm.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Giriş yapılıyor...';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      errorMessage.style.display = 'none';
      const { error } = await login(email, password);
      if (error) {
        errorMessage.textContent = error.message === 'Invalid login credentials' ? 'Hatalı e-posta veya şifre.' : error.message;
        errorMessage.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Giriş Yap';
      }
    });
  </script>
</body>
</html>
