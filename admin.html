<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | UCL & UEL Bahis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-tab-btn {
      padding: 0.65rem 1.2rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .admin-tab-btn.active { color: var(--ucl-cyan); border-bottom-color: var(--ucl-cyan); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body>
  <div id="toastContainer"></div>

  <nav>
    <a class="nav-brand" href="index.html">
      🏆 UCL & UEL <span class="league-tag" style="background:var(--warning); color:#000;">ADMIN</span>
    </a>
    <div class="nav-center" id="navCenter">
      <ul class="nav-links">
        <li><a href="matches.html">Maçlar</a></li>
        <li><a href="leaderboard.html">Sıralama</a></li>
        <li><a href="admin.html" class="active">Admin Paneli</a></li>
      </ul>
    </div>
    <div class="nav-actions">
      <button id="logoutBtn" class="btn btn-ghost" style="padding:0.4rem 0.875rem;font-size:0.8rem">Çıkış</button>
    </div>
  </nav>

  <div class="container animate-fade">
    <header style="margin-bottom:1.5rem;">
      <h1 class="gradient-text" style="font-size:2.2rem;margin-bottom:0.2rem">Admin Yönetim Paneli</h1>
      <p style="color:var(--text-muted);font-weight:600;">FB, GS ve BJK Maç Yönetimi, Skor Girme & Puan Hesaplama</p>
    </header>

    <div class="admin-tabs" style="display:flex; border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:1.5rem;">
      <button class="admin-tab-btn active" onclick="switchAdminTab('matches')">Maç Yönetimi</button>
      <button class="admin-tab-btn" onclick="switchAdminTab('addMatch')">+ Yeni Avrupa Maçı Ekle</button>
    </div>

    <!-- MAÇ YÖNETİMİ PANELİ -->
    <div class="tab-panel active" id="panelMatches">
      <div class="card">
        <h3 style="margin-bottom:1rem;">Mevcut Maçlar</h3>
        <div id="adminMatchesList">
          <div style="text-align:center; padding:2rem; color:var(--ucl-cyan);">Maçlar yükleniyor...</div>
        </div>
      </div>
    </div>

    <!-- YENİ MAÇ EKLE PANELİ -->
    <div class="tab-panel" id="panelAddMatch">
      <div class="card" style="max-width:600px;">
        <h3 style="margin-bottom:1.25rem;">Yeni UCL / UEL Maçı Oluştur</h3>
        <form id="createMatchForm">
          <div class="form-group">
            <label for="groupName">Organizasyon / Lig</label>
            <select id="groupName" class="form-input" required>
              <option value="UEFA Champions League">UEFA Champions League (Şampiyonlar Ligi)</option>
              <option value="UEFA Europa League">UEFA Europa League (Avrupa Ligi)</option>
            </select>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label for="homeTeam">Ev Sahibi Takım</label>
              <input type="text" id="homeTeam" class="form-input" placeholder="örn: Galatasaray" required>
            </div>
            <div class="form-group">
              <label for="homeFlag">Ev Sahibi Amblem/Emoji</label>
              <input type="text" id="homeFlag" class="form-input" placeholder="örn: 💛🔴" value="💛🔴">
            </div>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label for="awayTeam">Deplasman Takımı</label>
              <input type="text" id="awayTeam" class="form-input" placeholder="örn: Real Madrid" required>
            </div>
            <div class="form-group">
              <label for="awayFlag">Deplasman Amblem/Emoji</label>
              <input type="text" id="awayFlag" class="form-input" placeholder="örn: 👑" value="👑">
            </div>
          </div>

          <div class="form-group">
            <label for="matchTime">Maç Tarihi ve Saati</label>
            <input type="datetime-local" id="matchTime" class="form-input" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;">Maçı Oluştur ve Yayınla (1X2 Market Dahil)</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    window.showToast = function(message, type) {
      type = type || 'info';
      var container = document.getElementById('toastContainer');
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      var icons = { success: '✓', error: '✗', info: 'ℹ' };
      toast.innerHTML = '<span>' + (icons[type]||'ℹ') + '</span><span>' + message + '</span>';
      container.appendChild(toast);
      setTimeout(function() { toast.classList.add('show'); }, 10);
      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { toast.remove(); }, 300);
      }, 3500);
    };

    function switchAdminTab(tab) {
      document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      if (tab === 'matches') {
        document.querySelectorAll('.admin-tab-btn')[0].classList.add('active');
        document.getElementById('panelMatches').classList.add('active');
      } else {
        document.querySelectorAll('.admin-tab-btn')[1].classList.add('active');
        document.getElementById('panelAddMatch').classList.add('active');
      }
    }
  </script>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { requireAuth, logout, isAdmin } from './js/auth.js';

    let session;

    async function init() {
      session = await requireAuth();
      if (!session || !isAdmin(session)) {
        alert('Bu sayfaya erişim yetkiniz yok!');
        window.location.href = './matches.html';
        return;
      }
      document.getElementById('logoutBtn').addEventListener('click', logout);
      await loadAdminMatches();
    }

    async function loadAdminMatches() {
      const container = document.getElementById('adminMatchesList');
      const { data: matches, error } = await supabase
        .from('matches')
        .select('*')
        .order('match_time', { ascending: true });

      if (error) {
        container.innerHTML = `<div style="color:var(--danger);">Hata: ${error.message}</div>`;
        return;
      }

      if (!matches || matches.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-muted);">Henüz maç eklenmedi.</div>`;
        return;
      }

      container.innerHTML = `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>ORGANİZASYON</th>
              <th>MAÇ</th>
              <th>DURUM</th>
              <th style="text-align:center;">SKOR GİR & BİTİR</th>
              <th style="text-align:right;">İŞLEMLER</th>
            </tr>
          </thead>
          <tbody>
            ${matches.map(m => {
              const isFinished = m.status === 'finished';
              return `
                <tr>
                  <td>
                    <span class="competition-badge ${m.group_name.includes('Europa') ? 'comp-uel' : 'comp-ucl'}">${m.group_name}</span>
                  </td>
                  <td>
                    <span style="font-weight:700; color:#fff;">${m.home_flag} ${m.home_team} vs ${m.away_team} ${m.away_flag}</span>
                  </td>
                  <td>
                    <span class="status-badge ${isFinished ? 'badge-finished' : 'badge-open'}">${m.status}</span>
                  </td>
                  <td style="text-align:center;">
                    ${isFinished
                      ? `<strong style="font-size:1.2rem; color:var(--ucl-gold);">${m.home_score} - ${m.away_score}</strong>`
                      : `
                        <div style="display:inline-flex; gap:4px; align-items:center;">
                          <input type="number" id="hs_${m.id}" style="width:45px; text-align:center;" class="form-input" min="0" value="0">
                          <span>-</span>
                          <input type="number" id="as_${m.id}" style="width:45px; text-align:center;" class="form-input" min="0" value="0">
                          <button class="btn btn-primary finish-match-btn" data-id="${m.id}" style="padding:4px 8px; font-size:0.75rem;">Skoru İşle</button>
                        </div>
                      `}
                  </td>
                  <td style="text-align:right;">
                    <button class="btn btn-danger delete-match-btn" data-id="${m.id}" style="padding:4px 8px; font-size:0.75rem;">Sil</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;

      // Finish Match Event Listeners
      document.querySelectorAll('.finish-match-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const matchId = e.currentTarget.dataset.id;
          const homeScore = parseInt(document.getElementById(`hs_${matchId}`).value) || 0;
          const awayScore = parseInt(document.getElementById(`as_${matchId}`).value) || 0;

          let result = 'draw';
          if (homeScore > awayScore) result = 'home_win';
          else if (awayScore > homeScore) result = 'away_win';

          try {
            // Update Match Status and Score
            const { error: matchErr } = await supabase
              .from('matches')
              .update({
                home_score: homeScore,
                away_score: awayScore,
                result: result,
                status: 'finished'
              })
              .eq('id', matchId);

            if (matchErr) throw matchErr;

            // Evaluate predictions for this match
            const { data: markets } = await supabase.from('bet_markets').select('id').eq('match_id', matchId);
            if (markets && markets.length > 0) {
              const marketId = markets[0].id;
              const { data: options } = await supabase.from('bet_options').select('id, outcome_key').eq('market_id', marketId);

              // Mark correct options
              for (const opt of (options || [])) {
                const isCorrect = opt.outcome_key === result;
                await supabase.from('bet_options').update({ is_correct: isCorrect }).eq('id', opt.id);

                // Mark prediction records
                if (isCorrect) {
                  await supabase.from('predictions').update({ is_correct: true, points_earned: 1 }).eq('option_id', opt.id);
                } else {
                  await supabase.from('predictions').update({ is_correct: false, points_earned: 0 }).eq('market_id', marketId).neq('option_id', opt.id);
                }
              }
            }

            window.showToast('Skor girildi ve tahminler değerlendirildi!', 'success');
            await loadAdminMatches();
          } catch (err) {
            window.showToast('Skor işlenirken hata: ' + err.message, 'error');
          }
        });
      });

      // Delete Match Event Listeners
      document.querySelectorAll('.delete-match-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (!confirm('Bu maçı silmek istediğinizden emin misiniz?')) return;
          const matchId = e.currentTarget.dataset.id;
          await supabase.from('matches').delete().eq('id', matchId);
          window.showToast('Maç silindi.', 'info');
          await loadAdminMatches();
        });
      });
    }

    // Create New Match Form Submit
    document.getElementById('createMatchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const groupName = document.getElementById('groupName').value;
      const homeTeam = document.getElementById('homeTeam').value.trim();
      const homeFlag = document.getElementById('homeFlag').value.trim() || '⚽';
      const awayTeam = document.getElementById('awayTeam').value.trim();
      const awayFlag = document.getElementById('awayFlag').value.trim() || '⚽';
      const matchTime = document.getElementById('matchTime').value;

      const oddsApiId = `custom-${Date.now()}`;

      try {
        const { data: match, error: matchErr } = await supabase.from('matches').insert({
          odds_api_id: oddsApiId,
          home_team: homeTeam,
          away_team: awayTeam,
          home_flag: homeFlag,
          away_flag: awayFlag,
          match_time: new Date(matchTime).toISOString(),
          group_name: groupName,
          status: 'open',
          is_admin_approved: true
        }).select().single();

        if (matchErr) throw matchErr;

        // Create 1X2 Market
        const { data: market, error: mErr } = await supabase.from('bet_markets').insert({
          match_id: match.id,
          market_type: '1x2',
          label: 'Maç Sonucu (1 - X - 2)',
          is_active: true
        }).select().single();

        if (mErr) throw mErr;

        // Create 1X2 Options
        await supabase.from('bet_options').insert([
          { market_id: market.id, label: '1 (Ev Sahibi)', outcome_key: 'home_win', odds_value: 1.00 },
          { market_id: market.id, label: 'X (Beraberlik)', outcome_key: 'draw', odds_value: 1.00 },
          { market_id: market.id, label: '2 (Deplasman)', outcome_key: 'away_win', odds_value: 1.00 }
        ]);

        window.showToast('Yeni Avrupa Maçı eklendi!', 'success');
        switchAdminTab('matches');
        await loadAdminMatches();
      } catch (err) {
        window.showToast('Hata: ' + err.message, 'error');
      }
    });

    init();
  </script>
</body>
</html>
