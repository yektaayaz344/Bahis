<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maçlar | UCL & UEL Bahis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dual-prediction-box {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .pred-section-title {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-input-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: rgba(5, 8, 20, 0.6);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
    }

    .score-num-input {
      width: 55px;
      height: 42px;
      text-align: center;
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      background: rgba(18, 27, 58, 0.9);
      border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 6px;
      color: #fff;
    }

    .score-num-input:focus {
      outline: none;
      border-color: var(--ucl-cyan);
      box-shadow: 0 0 10px rgba(0, 217, 255, 0.4);
    }

    .team-logo-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    }
  </style>
</head>
<body>
  <div id="toastContainer"></div>

  <nav>
    <a class="nav-brand" href="index.html">
      🏆 UCL & UEL <span class="league-tag">FB • GS • BJK</span>
    </a>
    <div class="nav-center" id="navCenter">
      <ul class="nav-links">
        <li><a href="matches.html" class="active">Maçlar</a></li>
        <li><a href="leaderboard.html">Sıralama</a></li>
        <li><a href="my-stats.html">İstatistiklerim</a></li>
        <li><a href="admin.html" id="adminLink" style="display:none">Admin</a></li>
      </ul>
    </div>
    <div class="nav-actions">
      <button id="logoutBtn" class="btn btn-ghost" style="padding:0.4rem 0.875rem;font-size:0.8rem">Çıkış</button>
      <button class="nav-hamburger" id="hamburger" aria-label="Menü">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="container animate-fade">
    <header style="margin-bottom:2rem;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem">
      <div>
        <h1 class="gradient-text" style="font-size:2.25rem;margin-bottom:0.2rem">Avrupa Fikstürü (24 Maç)</h1>
        <p style="color:var(--text-muted);font-size:0.9rem;font-weight:600;">
          3 Tahmin: <strong>Maç Sonucu (1 Puan)</strong> | <strong>Golcü Tahmini (2 Puan)</strong> | <strong>Tam Skor (5 Puan)</strong>
        </p>
      </div>
    </header>

    <div id="matchesGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:1.5rem">
      <div class="card" style="grid-column:1/-1; text-align:center; padding:3rem;">
        <div style="color:var(--ucl-cyan); font-family:var(--font-display); font-size:1.5rem;">Fikstür Yükleniyor...</div>
      </div>
    </div>
  </div>

  <script>
    window.showToast = function(message, type) {
      type = type || 'info';
      var container = document.getElementById('toastContainer');
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      var icons = { success: '✓', error: '✗', info: 'ℹ' };
      toast.innerHTML = '<span>' + (icons[type]||'ℹ') + '</span><span>' + message + '</span>';
      container.appendChild(toast);
      setTimeout(function() { toast.classList.add('show'); }, 10);
      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { toast.remove(); }, 300);
      }, 3500);
    };

    document.getElementById('hamburger').addEventListener('click', function() {
      document.getElementById('navCenter').classList.toggle('open');
    });
  </script>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { requireAuth, logout, isAdmin } from './js/auth.js';

    let session;

    const TEAM_LOGOS = {
      'fenerbahçe': 'https://upload.wikimedia.org/wikipedia/tr/8/86/Fenerbah%C3%A7e_SK.svg',
      'galatasaray': 'https://upload.wikimedia.org/wikipedia/commons/3/37/Galatasaray_Star_Logo.svg',
      'beşiktaş': 'https://upload.wikimedia.org/wikipedia/commons/2/20/Besiktas_JK.svg',
      'roma': 'https://upload.wikimedia.org/wikipedia/en/f/f7/AS_Roma_logo_%282017%29.svg',
      'aston villa': 'https://upload.wikimedia.org/wikipedia/en/9/9f/Aston_Villa_logo_2024.svg',
      'slavia prag': 'https://upload.wikimedia.org/wikipedia/commons/e/ed/SK_Slavia_Praha_logo.svg',
      'liverpool': 'https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg',
      'shakhtar donetsk': 'https://upload.wikimedia.org/wikipedia/en/a/a1/FC_Shakhtar_Donetsk.svg',
      's. donetsk': 'https://upload.wikimedia.org/wikipedia/en/a/a1/FC_Shakhtar_Donetsk.svg',
      'lask': 'https://upload.wikimedia.org/wikipedia/commons/a/a2/LASK_Logo_2023.svg',
      'villarreal': 'https://upload.wikimedia.org/wikipedia/en/7/70/Villarreal_CF_logo.svg',
      'atletico madrid': 'https://upload.wikimedia.org/wikipedia/en/c/c1/Atletico_Madrid_logo_%282024%29.svg',
      'a. madrid': 'https://upload.wikimedia.org/wikipedia/en/c/c1/Atletico_Madrid_logo_%282024%29.svg',
      'sporting': 'https://upload.wikimedia.org/wikipedia/en/e/e1/Sporting_Clube_de_Portugal_%28logo%29.svg',
      'barcelona': 'https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg',
      'lille': 'https://upload.wikimedia.org/wikipedia/fr/6/62/Logo_LOSC_Lille_2018.svg',
      'stuttgart': 'https://upload.wikimedia.org/wikipedia/commons/e/eb/VfB_Stuttgart_1893_Logo.svg',
      'aek': 'https://upload.wikimedia.org/wikipedia/en/0/04/AEK_Athens_FC_logo.svg',
      'aek atina': 'https://upload.wikimedia.org/wikipedia/en/0/04/AEK_Athens_FC_logo.svg',
      'feyenoord': 'https://upload.wikimedia.org/wikipedia/commons/5/52/Feyenoord_logo_2024.svg',
      'psg': 'https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg',
      'marsilya': 'https://upload.wikimedia.org/wikipedia/commons/d/d8/Olympique_Marseille_logo.svg',
      'hoffenheim': 'https://upload.wikimedia.org/wikipedia/commons/e/e7/Logo_TSG_1899_Hoffenheim.svg',
      'crystal palace': 'https://upload.wikimedia.org/wikipedia/en/a/a2/Crystal_Palace_FC_logo.svg',
      'celtic': 'https://upload.wikimedia.org/wikipedia/en/3/3a/Celtic_FC.svg',
      'hapoel beer sheva': 'https://upload.wikimedia.org/wikipedia/en/d/dc/Hapoel_Be%27er_Sheva_FC.svg',
      'h. beer-sheva': 'https://upload.wikimedia.org/wikipedia/en/d/dc/Hapoel_Be%27er_Sheva_FC.svg',
      'bayer leverkusen': 'https://upload.wikimedia.org/wikipedia/en/5/59/Bayer_04_Leverkusen_logo.svg',
      'b. leverkusen': 'https://upload.wikimedia.org/wikipedia/en/5/59/Bayer_04_Leverkusen_logo.svg',
      'union sg': 'https://upload.wikimedia.org/wikipedia/en/0/05/Royale_Union_Saint-Gilloise_logo.svg',
      'union saint-gilloise': 'https://upload.wikimedia.org/wikipedia/en/0/05/Royale_Union_Saint-Gilloise_logo.svg',
      'omonia': 'https://upload.wikimedia.org/wikipedia/en/4/44/AC_Omonia_logo.svg'
    };

    function getTeamLogoHtml(teamName, flagEmoji) {
      const lower = teamName.toLowerCase();
      const logoUrl = TEAM_LOGOS[lower];
      if (logoUrl) {
        return `<img src="${logoUrl}" alt="${teamName}" class="team-logo-img" onerror="this.outerHTML='<span style=\\'font-size:1.8rem;\\'>${flagEmoji || '⚽'}</span>'">`;
      }
      return `<span style="font-size:1.8rem;">${flagEmoji || '⚽'}</span>`;
    }

    function getTeamClass(teamName) {
      const t = teamName.toLowerCase();
      if (t.includes('fener')) return 'team-fb';
      if (t.includes('galata')) return 'team-gs';
      if (t.includes('beşik') || t.includes('besik')) return 'team-bjk';
      return '';
    }

    async function init() {
      session = await requireAuth();
      if (!session) return;
      if (isAdmin(session)) document.getElementById('adminLink').style.display = 'block';

      document.getElementById('logoutBtn').addEventListener('click', logout);
      await loadMatches();
    }

    async function loadMatches() {
      const grid = document.getElementById('matchesGrid');

      const { data: matches, error } = await supabase
        .from('matches')
        .select('*, bet_markets(*, bet_options(*))')
        .eq('is_admin_approved', true)
        .order('match_time', { ascending: true });

      if (error) {
        grid.innerHTML = `<div class="card" style="color: var(--danger); grid-column:1/-1;">Hata: ${error.message}</div>`;
        return;
      }

      const { data: myPredictions } = await supabase
        .from('predictions')
        .select('*')
        .eq('user_id', session.user.id);

      const predMap = new Map(myPredictions?.map(p => [p.market_id, p]));

      if (!matches || matches.length === 0) {
        grid.innerHTML = `
          <div class="card" style="text-align:center;color:var(--text-muted);grid-column:1/-1;padding:3.5rem;">
            <h3>Şu an aktif maç bulunmuyor.</h3>
          </div>
        `;
        return;
      }

      grid.innerHTML = matches.map(match => {
        const date = new Date(match.match_time).toLocaleString('tr-TR', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' });
        const isFinished = match.status === 'finished';
        const isLocked = match.status === 'locked' || isFinished;
        const statusLabel = isFinished ? 'BİTTİ' : (isLocked ? 'KİLİTLİ' : 'AÇIK');
        const statusClass = isFinished ? 'badge-finished' : (isLocked ? 'badge-locked' : 'badge-open');
        const compClass = (match.group_name || '').toLowerCase().includes('europa') ? 'comp-uel' : 'comp-ucl';

        const homeClass = getTeamClass(match.home_team);
        const awayClass = getTeamClass(match.away_team);

        const homeLogoHtml = getTeamLogoHtml(match.home_team, match.home_flag);
        const awayLogoHtml = getTeamLogoHtml(match.away_team, match.away_flag);

        const market1X2 = match.bet_markets?.find(m => m.market_type === '1x2');
        const marketScorer = match.bet_markets?.find(m => m.market_type === 'goalscorer');
        const marketScore = match.bet_markets?.find(m => m.market_type === 'exact_score');

        const pred1X2 = market1X2 ? predMap.get(market1X2.id) : null;
        const predScorer = marketScorer ? predMap.get(marketScorer.id) : null;
        const predScore = marketScore ? predMap.get(marketScore.id) : null;

        // 1X2 HTML (1 Puan)
        let html1X2 = '';
        if (market1X2) {
          const keyOrder = { home_win: 0, draw: 1, away_win: 2 };
          const sortedOptions = [...(market1X2.bet_options || [])].sort((a, b) => (keyOrder[a.outcome_key] ?? 99) - (keyOrder[b.outcome_key] ?? 99));

          html1X2 = `
            <div>
              <div class="pred-section-title">
                <span>1. MAÇ SONUCU TAHMİNİ</span>
                <span style="color:var(--ucl-cyan);">1 PUAN</span>
              </div>
              <div class="predict-picker-grid" style="margin-top:0.4rem; border-top:none; padding-top:0;">
                ${sortedOptions.map(opt => {
                  const isSelected = pred1X2 && pred1X2.option_id === opt.id;
                  let optClass = 'pick-btn';
                  if (isSelected) optClass += ' selected';
                  if (isFinished && opt.is_correct) optClass += ' correct';
                  if (isFinished && isSelected && !opt.is_correct) optClass += ' wrong';

                  const labelCode = opt.outcome_key === 'home_win' ? '1' : (opt.outcome_key === 'draw' ? 'X' : '2');
                  const subTitle = opt.outcome_key === 'home_win' ? 'Ev Sahibi' : (opt.outcome_key === 'draw' ? 'Beraberlik' : 'Deplasman');

                  return `
                    <button class="${optClass}" ${isLocked ? 'disabled' : ''} data-market-id="${market1X2.id}" data-match-id="${match.id}" data-option-id="${opt.id}">
                      <span class="pick-code">${labelCode}</span>
                      <span class="pick-label">${subTitle}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }

        // Goalscorer HTML (2 Puan)
        let htmlScorer = '';
        if (marketScorer) {
          const currentScorerPred = predScorer?.predicted_scorer ?? '';
          const scorerOptionId = marketScorer.bet_options?.[0]?.id;

          htmlScorer = `
            <div>
              <div class="pred-section-title" style="margin-bottom:0.4rem;">
                <span>2. GOL ATACAK OYUNCU (TEK HAK)</span>
                <span style="color:var(--success);">2 PUAN</span>
              </div>
              <div class="score-input-group" style="gap:0.5rem;">
                <input type="text" class="form-input" id="scorer_pred_${match.id}" value="${currentScorerPred}" placeholder="örn: Mauro Icardi / En-Nesyri" ${isLocked ? 'disabled' : ''} style="font-weight:600;">
                <button class="btn btn-outline save-scorer-btn" style="padding:0.5rem 0.88rem; font-size:0.78rem;" ${isLocked ? 'disabled' : ''}
                  data-match-id="${match.id}" data-market-id="${marketScorer.id}" data-option-id="${scorerOptionId}">
                  Kaydet
                </button>
              </div>
              ${predScorer && predScorer.predicted_scorer ? `
                <div style="font-size:0.75rem; text-align:center; margin-top:4px; color:var(--success);">
                  Kaydedilen Golcü Tahmininiz: <strong>${predScorer.predicted_scorer}</strong>
                </div>
              ` : ''}
            </div>
          `;
        }

        // Exact Score HTML (5 Puan)
        let htmlScore = '';
        if (marketScore) {
          const currentHomePred = predScore?.predicted_home_score ?? '';
          const currentAwayPred = predScore?.predicted_away_score ?? '';
          const scoreOptionId = marketScore.bet_options?.[0]?.id;

          htmlScore = `
            <div>
              <div class="pred-section-title" style="margin-bottom:0.4rem;">
                <span>3. TAM MAÇ SKORU</span>
                <span style="color:var(--ucl-gold);">5 PUAN</span>
              </div>
              <div class="score-input-group">
                <span style="font-weight:700; font-size:0.85rem; color:#fff;">${match.home_team}</span>
                <input type="number" min="0" max="20" class="score-num-input" id="hs_pred_${match.id}" value="${currentHomePred}" placeholder="0" ${isLocked ? 'disabled' : ''}>
                <span style="font-weight:800; color:var(--text-muted);">-</span>
                <input type="number" min="0" max="20" class="score-num-input" id="as_pred_${match.id}" value="${currentAwayPred}" placeholder="0" ${isLocked ? 'disabled' : ''}>
                <span style="font-weight:700; font-size:0.85rem; color:#fff;">${match.away_team}</span>
                <button class="btn btn-outline save-score-btn" style="padding:0.4rem 0.75rem; font-size:0.75rem;" ${isLocked ? 'disabled' : ''}
                  data-match-id="${match.id}" data-market-id="${marketScore.id}" data-option-id="${scoreOptionId}">
                  Kaydet
                </button>
              </div>
              ${predScore && predScore.predicted_home_score !== null ? `
                <div style="font-size:0.75rem; text-align:center; margin-top:4px; color:var(--ucl-gold);">
                  Kaydedilen Skor Tahmininiz: <strong>${predScore.predicted_home_score} - ${predScore.predicted_away_score}</strong>
                </div>
              ` : ''}
            </div>
          `;
        }

        return `
          <div class="card animate-fade">
            <div class="match-header-bar">
              <span class="competition-badge ${compClass}">${match.group_name || 'UEFA Champions League'}</span>
              <span class="match-date-time">📅 ${date}</span>
            </div>

            <div class="match-teams-display">
              <div class="team-box ${homeClass}">
                <div class="team-badge-circle">${homeLogoHtml}</div>
                <span class="team-name-text">${match.home_team}</span>
              </div>

              <div class="match-vs-score">
                ${isFinished
                  ? `<span class="score-badge">${match.home_score} - ${match.away_score}</span>`
                  : `<span class="vs-badge">VS</span>`}
                <span class="status-badge ${statusClass}">${statusLabel}</span>
              </div>

              <div class="team-box ${awayClass}">
                <div class="team-badge-circle">${awayLogoHtml}</div>
                <span class="team-name-text">${match.away_team}</span>
              </div>
            </div>

            <div class="dual-prediction-box">
              ${html1X2}
              ${htmlScorer}
              ${htmlScore}
            </div>
          </div>
        `;
      }).join('');

      // Click listener for 1X2 pick buttons
      document.querySelectorAll('.pick-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const target = e.currentTarget;
          const matchId = target.dataset.matchId;
          const marketId = target.dataset.marketId;
          const optionId = target.dataset.optionId;

          try {
            const { error } = await supabase.from('predictions').upsert({
              user_id: session.user.id,
              match_id: matchId,
              market_id: marketId,
              option_id: optionId,
              odds_at_prediction: 1.00
            }, { onConflict: 'user_id, market_id' });

            if (error) throw error;
            window.showToast('Maç sonucu tahmininiz kaydedildi! (+1 Puan adayı)', 'success');
            await loadMatches();
          } catch (err) {
            window.showToast('Hata: ' + err.message, 'error');
          }
        });
      });

      // Click listener for Save Scorer buttons
      document.querySelectorAll('.save-scorer-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const target = e.currentTarget;
          const matchId = target.dataset.matchId;
          const marketId = target.dataset.marketId;
          const optionId = target.dataset.optionId;
          const scorerVal = document.getElementById(`scorer_pred_${matchId}`).value.trim();

          if (!scorerVal) {
            window.showToast('Lütfen gol atacağını düşündüğünüz futbolcu adını girin!', 'error');
            return;
          }

          try {
            const { error } = await supabase.from('predictions').upsert({
              user_id: session.user.id,
              match_id: matchId,
              market_id: marketId,
              option_id: optionId,
              predicted_scorer: scorerVal,
              odds_at_prediction: 1.00
            }, { onConflict: 'user_id, market_id' });

            if (error) throw error;
            window.showToast(`Golcü tahmininiz kaydedildi: ${scorerVal} (+2 Puan adayı)`, 'success');
            await loadMatches();
          } catch (err) {
            window.showToast('Hata: ' + err.message, 'error');
          }
        });
      });

      // Click listener for Save Score buttons
      document.querySelectorAll('.save-score-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const target = e.currentTarget;
          const matchId = target.dataset.matchId;
          const marketId = target.dataset.marketId;
          const optionId = target.dataset.optionId;

          const homeVal = document.getElementById(`hs_pred_${matchId}`).value;
          const awayVal = document.getElementById(`as_pred_${matchId}`).value;

          if (homeVal === '' || awayVal === '') {
            window.showToast('Lütfen her iki skor alanını da doldurun!', 'error');
            return;
          }

          try {
            const { error } = await supabase.from('predictions').upsert({
              user_id: session.user.id,
              match_id: matchId,
              market_id: marketId,
              option_id: optionId,
              predicted_home_score: parseInt(homeVal),
              predicted_away_score: parseInt(awayVal),
              odds_at_prediction: 1.00
            }, { onConflict: 'user_id, market_id' });

            if (error) throw error;
            window.showToast(`Maç skoru tahmininiz kaydedildi: ${homeVal} - ${awayVal} (+5 Puan adayı)`, 'success');
            await loadMatches();
          } catch (err) {
            window.showToast('Hata: ' + err.message, 'error');
          }
        });
      });
    }

    init();
  </script>
</body>
</html>
