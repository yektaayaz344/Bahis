  <script>
    window.showToast = function(message, type) {
      type = type || 'info';
      var container = document.getElementById('toastContainer');
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      var icons = { success: '✓', error: '✗', info: 'ℹ' };
      toast.innerHTML = '<span>' + (icons[type]||'ℹ') + '</span><span>' + message + '</span>';
      container.appendChild(toast);
      setTimeout(function() { toast.classList.add('show'); }, 10);
      setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { toast.remove(); }, 300);
      }, 3500);
    };

    document.getElementById('hamburger').addEventListener('click', function() {
      document.getElementById('navCenter').classList.toggle('open');
    });
  </script>

    function getTeamLogoHtml(teamName) {
      const lower = (teamName || '').toLowerCase().trim();
      const logoPath = LOCAL_TEAM_LOGOS[lower];

      if (logoPath) {
        return `<img src="${logoPath}" alt="${teamName}" class="team-logo-img">`;
      }
      return `<div style="width:48px;height:48px;border-radius:50%;background:var(--ucl-blue);border:2px solid var(--ucl-cyan);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:0.9rem;">${teamName.substring(0,3).toUpperCase()}</div>`;
    }

    function getTeamClass(teamName) {
      const t = teamName.toLowerCase();
      if (t.includes('fener')) return 'team-fb';
      if (t.includes('galata')) return 'team-gs';
      if (t.includes('beşik') || t.includes('besik')) return 'team-bjk';
      return '';
    }

    async function ensureAll24FixturesInDb() {
      for (const item of ALL_24_FIXTURES) {
        const { data: match } = await supabase.from('matches').upsert({
          odds_api_id: item.id,
          home_team: item.home,
          away_team: item.away,
          match_time: item.date,
          group_name: item.league,
          status: 'open',
          is_admin_approved: true
        }, { onConflict: 'odds_api_id' }).select('id').single();

        if (match) {
          // 1. 1X2 Market
          const { data: ex1 } = await supabase.from('bet_markets').select('id').eq('match_id', match.id).eq('market_type', '1x2').maybeSingle();
          let m1Id = ex1?.id;
          if (!m1Id) {
            const { data: n1 } = await supabase.from('bet_markets').insert({
              match_id: match.id, market_type: '1x2', label: 'Maç Sonucu (1 Puan)', is_active: true
            }).select('id').single();
            m1Id = n1?.id;
          }
          if (m1Id) {
            const { data: opts } = await supabase.from('bet_options').select('id').eq('market_id', m1Id);
            if (!opts || opts.length === 0) {
              await supabase.from('bet_options').insert([
                { market_id: m1Id, label: '1 (Ev Sahibi)', outcome_key: 'home_win', odds_value: 1.00 },
                { market_id: m1Id, label: 'X (Beraberlik)', outcome_key: 'draw', odds_value: 1.00 },
                { market_id: m1Id, label: '2 (Deplasman)', outcome_key: 'away_win', odds_value: 1.00 }
              ]);
            }
          }

          // 2. Scorer Market
          const { data: ex2 } = await supabase.from('bet_markets').select('id').eq('match_id', match.id).eq('market_type', 'goalscorer').maybeSingle();
          let m2Id = ex2?.id;
          if (!m2Id) {
            const { data: n2 } = await supabase.from('bet_markets').insert({
              match_id: match.id, market_type: 'goalscorer', label: 'Gol Atacak Oyuncu (2 Puan)', is_active: true
            }).select('id').single();
            m2Id = n2?.id;
          }
          if (m2Id) {
            const { data: opts } = await supabase.from('bet_options').select('id').eq('market_id', m2Id);
            if (!opts || opts.length === 0) {
              await supabase.from('bet_options').insert([
                { market_id: m2Id, label: 'Golcü Tahmini', outcome_key: 'goalscorer', odds_value: 1.00 }
              ]);
            }
          }

          // 3. Exact Score Market
          const { data: ex3 } = await supabase.from('bet_markets').select('id').eq('match_id', match.id).eq('market_type', 'exact_score').maybeSingle();
          let m3Id = ex3?.id;
          if (!m3Id) {
            const { data: n3 } = await supabase.from('bet_markets').insert({
              match_id: match.id, market_type: 'exact_score', label: 'Maç Skoru (5 Puan)', is_active: true
            }).select('id').single();
            m3Id = n3?.id;
          }
          if (m3Id) {
            const { data: opts } = await supabase.from('bet_options').select('id').eq('market_id', m3Id);
            if (!opts || opts.length === 0) {
              await supabase.from('bet_options').insert([
                { market_id: m3Id, label: 'Maç Skoru', outcome_key: 'exact_score', odds_value: 1.00 }
              ]);
            }
          }
        }
      }
    }

    async function ensureMarketExists(matchId, marketType, label) {
      const { data: existing } = await supabase.from('bet_markets').select('id').eq('match_id', matchId).eq('market_type', marketType).maybeSingle();
      if (existing) return existing.id;

      const { data: newMarket } = await supabase.from('bet_markets').insert({
        match_id: matchId,
        market_type: marketType,
        label: label,
        is_active: true
      }).select('id').single();

      if (newMarket) {
        await supabase.from('bet_options').insert([
          { market_id: newMarket.id, label: label, outcome_key: marketType, odds_value: 1.00 }
        ]);
        return newMarket.id;
      }
      return null;
    }

    async function init() {
      session = await requireAuth();
      if (!session) return;
      if (isAdmin(session)) document.getElementById('adminLink').style.display = 'block';

      document.getElementById('logoutBtn').addEventListener('click', logout);
      await ensureAll24FixturesInDb();
      await loadMatches();
    }

    async function loadMatches() {
      const grid = document.getElementById('matchesGrid');

      const { data: matches, error } = await supabase
        .from('matches')
        .select('*, bet_markets(*, bet_options(*))')
        .eq('is_admin_approved', true)
        .order('match_time', { ascending: true });

      if (error) {
        grid.innerHTML = `<div class="card" style="color: var(--danger); grid-column:1/-1;">Hata: ${error.message}</div>`;
        return;
      }

      const { data: myPredictions } = await supabase
        .from('predictions')
        .select('*, bet_markets(market_type), bet_options(outcome_key, label)')
        .eq('user_id', session.user.id);

      // Aynı maç+tip için birden fazla market satırı oluşabildiğinden (import / ensureMarket
      // yolları), tahmini market_id yerine "matchId:marketType" ile de eşliyoruz ki
      // kullanıcı ne kaydettiyse sonradan mutlaka görebilsin.
      const predMap = new Map();
      (myPredictions || []).forEach(p => {
        if (p.market_id) predMap.set(p.market_id, p);
        const mt = p.bet_markets?.market_type;
        if (mt) predMap.set(`${p.match_id}:${mt}`, p);
      });

      if (!matches || matches.length === 0) {
        grid.innerHTML = `<div class="card" style="text-align:center;padding:3rem;">Aktif maç bulunamadı.</div>`;
        return;
      }

      const now = new Date();

      grid.innerHTML = matches.map(match => {
        const dateObj = new Date(match.match_time);
        const dateStr = dateObj.toLocaleString('tr-TR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

        // MAÇ GÜNÜ BAŞLADIĞINDA KİLİTLEME KONTROLÜ (00:00)
        const matchDayStart = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
        const isAutoLocked = now >= matchDayStart;

        const isFinished = match.status === 'finished';
        const isLocked = match.status === 'locked' || isFinished || isAutoLocked;

        let statusLabel = 'AÇIK';
        let statusClass = 'badge-open';

        if (isFinished) {
          statusLabel = 'BİTTİ';
          statusClass = 'badge-finished';
        } else if (isLocked) {
          statusLabel = '🔒 KİLİTLİ (Maç Günü)';
          statusClass = 'badge-locked';
        }

        const compClass = (match.group_name || '').toLowerCase().includes('europa') ? 'comp-uel' : 'comp-ucl';

        const homeClass = getTeamClass(match.home_team);
        const awayClass = getTeamClass(match.away_team);

        const homeLogoHtml = getTeamLogoHtml(match.home_team);
        const awayLogoHtml = getTeamLogoHtml(match.away_team);

        const market1X2 = match.bet_markets?.find(m => m.market_type === '1x2');
        const marketScorer = match.bet_markets?.find(m => m.market_type === 'goalscorer');
        const marketScore = match.bet_markets?.find(m => m.market_type === 'exact_score');

        const pred1X2 = predMap.get(`${match.id}:1x2`) || (market1X2 ? predMap.get(market1X2.id) : null);
        const predScorer = predMap.get(`${match.id}:goalscorer`) || (marketScorer ? predMap.get(marketScorer.id) : null);
        const predScore = predMap.get(`${match.id}:exact_score`) || (marketScore ? predMap.get(marketScore.id) : null);

        // 1. Maç Sonucu (1 Puan)
        const keyOrder = { home_win: 0, draw: 1, away_win: 2 };
        const sortedOptions = [...(market1X2?.bet_options || [
          { outcome_key: 'home_win', label: '1 (Ev Sahibi)', id: 'opt_1' },
          { outcome_key: 'draw', label: 'X (Beraberlik)', id: 'opt_x' },
          { outcome_key: 'away_win', label: '2 (Deplasman)', id: 'opt_2' }
        ])].sort((a, b) => (keyOrder[a.outcome_key] ?? 99) - (keyOrder[b.outcome_key] ?? 99));

        const html1X2 = `
          <div>
            <div class="pred-section-title">
              <span>1. MAÇ SONUCU TAHMİNİ</span>
              <span style="color:var(--ucl-cyan);">1 PUAN</span>
            </div>
            <div class="predict-picker-grid" style="margin-top:0.4rem; border-top:none; padding-top:0;">
              ${sortedOptions.map(opt => {
                const isSelected = pred1X2 && (
                  pred1X2.option_id === opt.id ||
                  (pred1X2.bet_options?.outcome_key && pred1X2.bet_options.outcome_key === opt.outcome_key)
                );
                let optClass = 'pick-btn';
                if (isSelected) optClass += ' selected';
                if (isFinished && opt.is_correct) optClass += ' correct';
                if (isFinished && isSelected && !opt.is_correct) optClass += ' wrong';

                const labelCode = opt.outcome_key === 'home_win' ? '1' : (opt.outcome_key === 'draw' ? 'X' : '2');
                const subTitle = opt.outcome_key === 'home_win' ? 'Ev Sahibi' : (opt.outcome_key === 'draw' ? 'Beraberlik' : 'Deplasman');

                return `
                  <button class="${optClass}" ${isLocked ? 'disabled' : ''} data-market-id="${market1X2?.id || ''}" data-match-id="${match.id}" data-outcome="${opt.outcome_key}">
                    <span class="pick-code">${labelCode}</span>
                    <span class="pick-label">${subTitle}</span>
                  </button>
                `;
              }).join('')}
            </div>
            ${pred1X2 ? `
              <div style="font-size:0.75rem; text-align:center; margin-top:4px; color:var(--ucl-cyan);">
                Kaydedilen Sonuç Tahmininiz: <strong>${
                  (pred1X2.bet_options?.outcome_key || '') === 'home_win' ? '1 (Ev Sahibi)' :
                  (pred1X2.bet_options?.outcome_key || '') === 'draw' ? 'X (Beraberlik)' :
                  (pred1X2.bet_options?.outcome_key || '') === 'away_win' ? '2 (Deplasman)' :
                  (pred1X2.bet_options?.label || '—')
                }</strong>
              </div>
            ` : ''}
          </div>
        `;

        // 2. Golcü Tahmini (2 Puan)
        const currentScorerPred = predScorer?.predicted_scorer ?? '';
        const htmlScorer = `
          <div>
            <div class="pred-section-title" style="margin-bottom:0.4rem;">
              <span>2. GOL ATACAK OYUNCU (TEK HAK)</span>
              <span style="color:var(--success);">2 PUAN</span>
            </div>
            <div class="score-input-group" style="gap:0.5rem;">
              <input type="text" class="form-input" id="scorer_pred_${match.id}" value="${currentScorerPred}" placeholder="örn: Mauro Icardi / En-Nesyri" ${isLocked ? 'disabled' : ''} style="font-weight:600;">
              <button class="btn btn-outline save-scorer-btn" style="padding:0.5rem 0.88rem; font-size:0.78rem;" ${isLocked ? 'disabled' : ''}
                data-match-id="${match.id}" data-market-id="${marketScorer?.id || ''}">
                Kaydet
              </button>
            </div>
            ${predScorer && predScorer.predicted_scorer ? `
              <div style="font-size:0.75rem; text-align:center; margin-top:4px; color:var(--success);">
                Kaydedilen Golcü Tahmininiz: <strong>${predScorer.predicted_scorer}</strong>
              </div>
            ` : ''}
          </div>
        `;

        // 3. Tam Maç Skoru (5 Puan) — TAKIM İSİMLERİ KALDIRILDI, SADECE SKOR GİRDİSİ VE KAYDET BUTONU
        const currentHomePred = predScore?.predicted_home_score ?? '';
        const currentAwayPred = predScore?.predicted_away_score ?? '';
        const htmlScore = `
          <div>
            <div class="pred-section-title" style="margin-bottom:0.4rem;">
              <span>3. TAM MAÇ SKORU</span>
              <span style="color:var(--ucl-gold);">5 PUAN</span>
            </div>
            <div class="score-input-group">
              <input type="number" min="0" max="20" class="score-num-input" id="hs_pred_${match.id}" value="${currentHomePred}" placeholder="0" ${isLocked ? 'disabled' : ''}>
              <span style="font-weight:800; font-size:1.3rem; color:var(--text-muted);">-</span>
              <input type="number" min="0" max="20" class="score-num-input" id="as_pred_${match.id}" value="${currentAwayPred}" placeholder="0" ${isLocked ? 'disabled' : ''}>
              <button class="btn btn-outline save-score-btn" style="padding:0.5rem 0.88rem; font-size:0.78rem;" ${isLocked ? 'disabled' : ''}
                data-match-id="${match.id}" data-market-id="${marketScore?.id || ''}">
                Kaydet
              </button>
            </div>
            ${predScore && predScore.predicted_home_score !== null ? `
              <div style="font-size:0.75rem; text-align:center; margin-top:4px; color:var(--ucl-gold);">
                Kaydedilen Skor Tahmininiz: <strong>${predScore.predicted_home_score} - ${predScore.predicted_away_score}</strong>
              </div>
            ` : ''}
          </div>
        `;

        return `
          <div class="card animate-fade">
            <div class="match-header-bar">
              <span class="competition-badge ${compClass}">${match.group_name || 'UEFA Champions League'}</span>
              <span class="match-date-time">📅 ${dateStr}</span>
            </div>

            <div class="match-teams-display">
              <div class="team-box ${homeClass}">
                <div class="team-badge-circle">${homeLogoHtml}</div>
                <span class="team-name-text">${match.home_team}</span>
              </div>

              <div class="match-vs-score">
                ${isFinished
                  ? `<span class="score-badge">${match.home_score} - ${match.away_score}</span>`
                  : `<span class="vs-badge">VS</span>`}
                <span class="status-badge ${statusClass}">${statusLabel}</span>
              </div>

              <div class="team-box ${awayClass}">
                <div class="team-badge-circle">${awayLogoHtml}</div>
                <span class="team-name-text">${match.away_team}</span>
              </div>
            </div>

            <div class="dual-prediction-box">
              ${html1X2}
              ${htmlScorer}
              ${htmlScore}
            </div>
          </div>
        `;
      }).join('');

      // Click listener for 1X2 pick buttons
      document.querySelectorAll('.pick-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const target = e.currentTarget;
          const matchId = target.dataset.matchId;
          const outcomeKey = target.dataset.outcome;

          try {
            let marketId = target.dataset.marketId;
            if (!marketId) {
              marketId = await ensureMarketExists(matchId, '1x2', 'Maç Sonucu (1 Puan)');
            }

            const { data: options } = await supabase.from('bet_options').select('id').eq('market_id', marketId).eq('outcome_key', outcomeKey);
            const optionId = options?.[0]?.id;

            const { error } = await supabase.from('predictions').upsert({
              user_id: session.user.id,
              match_id: matchId,
              market_id: marketId,
              option_id: optionId,
              odds_at_prediction: 1.00
            }, { onConflict: 'user_id, market_id' });

            if (error) throw error;
            window.showToast('Maç sonucu tahmininiz kaydedildi! (+1 Puan adayı)', 'success');
            await loadMatches();
          } catch (err) {
            window.showToast('Hata: ' + err.message, 'error');
          }
        });
      });

      // Click listener for Save Scorer buttons
      document.querySelectorAll('.save-scorer-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const target = e.currentTarget;
          const matchId = target.dataset.matchId;
          const scorerVal = document.getElementById(`scorer_pred_${matchId}`).value.trim();

          if (!scorerVal) {
            window.showToast('Lütfen gol atacağını düşündüğünüz futbolcu adını girin!', 'error');
            return;
          }

          try {
            let marketId = target.dataset.marketId;
            if (!marketId) {
              marketId = await ensureMarketExists(matchId, 'goalscorer', 'Gol Atacak Oyuncu (2 Puan)');
            }

            const { data: options } = await supabase.from('bet_options').select('id').eq('market_id', marketId);
            const optionId = options?.[0]?.id;

            const { error } = await supabase.from('predictions').upsert({
              user_id: session.user.id,
              match_id: matchId,
              market_id: marketId,
              option_id: optionId,
              predicted_scorer: scorerVal,
              odds_at_prediction: 1.00
            }, { onConflict: 'user_id, market_id' });

            if (error) throw error;
            window.showToast(`Golcü tahmininiz kaydedildi: ${scorerVal} (+2 Puan adayı)`, 'success');
            await loadMatches();
          } catch (err) {
            window.showToast('Hata: ' + err.message, 'error');
          }
        });
      });

      // Click listener for Save Score buttons
      document.querySelectorAll('.save-score-btn:not([disabled])').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const target = e.currentTarget;
          const matchId = target.dataset.matchId;
          const homeVal = document.getElementById(`hs_pred_${matchId}`).value;
          const awayVal = document.getElementById(`as_pred_${matchId}`).value;

          if (homeVal === '' || awayVal === '') {
            window.showToast('Lütfen her iki skor alanını da doldurun!', 'error');
            return;
          }

          try {
            let marketId = target.dataset.marketId;
            if (!marketId) {
              marketId = await ensureMarketExists(matchId, 'exact_score', 'Maç Skoru (5 Puan)');
            }

            const { data: options } = await supabase.from('bet_options').select('id').eq('market_id', marketId);
            const optionId = options?.[0]?.id;

            const { error } = await supabase.from('predictions').upsert({
              user_id: session.user.id,
              match_id: matchId,
              market_id: marketId,
              option_id: optionId,
              predicted_home_score: parseInt(homeVal),
              predicted_away_score: parseInt(awayVal),
              odds_at_prediction: 1.00
            }, { onConflict: 'user_id, market_id' });

            if (error) throw error;
            window.showToast(`Maç skoru tahmininiz kaydedildi: ${homeVal} - ${awayVal} (+5 Puan adayı)`, 'success');
            await loadMatches();
          } catch (err) {
            window.showToast('Hata: ' + err.message, 'error');
          }
        });
      });
    }

    init();
  </script>
</body>
</html>
